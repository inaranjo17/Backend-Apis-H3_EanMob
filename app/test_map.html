<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EANMob — Test Mapa Ofertantes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0fdf4;
      color: #1e1e1e;
    }

    header {
      background: #003366;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 20px; }
    header span { font-size: 13px; opacity: 0.7; }

    .layout {
      display: flex;
      height: calc(100vh - 60px);
    }

    /* ── Panel izquierdo ── */
    .panel {
      width: 340px;
      min-width: 300px;
      background: white;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-section {
      padding: 16px;
      border-bottom: 1px solid #f1f5f9;
    }

    .panel-section h3 {
      font-size: 13px;
      font-weight: 600;
      color: #003366;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 3px;
      margin-top: 8px;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      color: #1e1e1e;
      background: #f8fafc;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #22c55e;
      background: white;
    }

    .btn {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #16a34a; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }

    .btn-secondary {
      background: #003366;
      margin-top: 6px;
    }
    .btn-secondary:hover { background: #002244; }

    /* Estado */
    .status {
      padding: 10px 16px;
      font-size: 12px;
      background: #f8fafc;
      border-bottom: 1px solid #f1f5f9;
      color: #666;
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status.ok { color: #16a34a; }
    .status.err { color: #dc2626; }
    .status.loading { color: #2563eb; }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* Lista de resultados */
    .results {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .card:hover {
      border-color: #22c55e;
      background: #f0fdf4;
    }

    .card.active {
      border-color: #22c55e;
      background: #dcfce7;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-name {
      font-weight: 600;
      font-size: 14px;
      color: #003366;
    }

    .score-badge {
      background: #003366;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .card-row {
      font-size: 12px;
      color: #555;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .card-row span { color: #1e1e1e; font-weight: 500; }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      font-size: 13px;
    }

    /* ── Mapa ── */
    #map {
      flex: 1;
      background: #e2e8f0;
    }

    /* Token section */
    .token-area {
      font-size: 11px;
      resize: none;
      height: 60px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🗺️ EANMob — Test Mapa</h1>
    <span>Prueba del endpoint /match/nearby</span>
  </div>
</header>

<div class="layout">

  <!-- ── Panel izquierdo ── -->
  <div class="panel">

    <!-- Token JWT -->
    <div class="panel-section">
      <h3>🔐 Autenticación</h3>
      <label>Token JWT</label>
      <textarea id="jwt-token" class="token-area"
        placeholder="Pega aquí el token JWT generado en la terminal..."></textarea>
      <button class="btn btn-secondary" onclick="generateTestToken()">
        Generar token de prueba
      </button>
    </div>

    <!-- Parámetros de búsqueda -->
    <div class="panel-section">
      <h3>📍 Búsqueda</h3>

      <label>H3 Origen (del pasajero)</label>
      <input id="h3-origin" value="8966e42d62bffff" />

      <label>H3 Destino</label>
      <input id="h3-dest" value="8966e42d6b3ffff" />

      <label>Latitud del pasajero</label>
      <input id="my-lat" type="number" step="0.0001" value="4.6582" />

      <label>Longitud del pasajero</label>
      <input id="my-lng" type="number" step="0.0001" value="-74.0936" />

      <label>Hora de salida deseada</label>
      <input id="departure" type="datetime-local"
        value="2026-04-20T07:45" />

      <label>Tolerancia (minutos)</label>
      <input id="tolerance" type="number" value="30" />

      <label>Radio H3 (k)</label>
      <select id="k-radius">
        <option value="1" selected>k=1 (~174m)</option>
        <option value="2">k=2 (~500m)</option>
        <option value="3">k=3 (~800m)</option>
      </select>

      <button class="btn" onclick="buscarConductores()" id="btn-buscar">
        🔍 Buscar conductores
      </button>
    </div>

    <!-- Estado -->
    <div class="status" id="status">
      <div class="dot"></div>
      Listo para buscar
    </div>

    <!-- Resultados -->
    <div class="results" id="results">
      <div class="empty">Los conductores disponibles aparecerán aquí</div>
    </div>

  </div>

  <!-- ── Mapa ── -->
  <div id="map"></div>

</div>

<script>
// ══════════════════════════════════════════
// CONFIGURACIÓN — cambia solo esta parte
// ══════════════════════════════════════════
const FRONTEND_KEY = "GOOGLE_MAPS_API_KEY_FRONTEND";  // ← pega el AIza...
const API_BASE     = "http://127.0.0.1:8000";       // ← URL de tu FastAPI

// ══════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════
let map, markers = [], infoWindow, passengerMarker;

// ══════════════════════════════════════════
// INICIALIZAR MAPA
// ══════════════════════════════════════════
function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 4.6582, lng: -74.0936 },
    zoom: 14,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: true,
    styles: [
      { featureType: "poi", stylers: [{ visibility: "off" }] }
    ]
  });

  infoWindow = new google.maps.InfoWindow();
  setStatus("Mapa listo ✓", "ok");
}

// ══════════════════════════════════════════
// BUSCAR CONDUCTORES
// ══════════════════════════════════════════
async function buscarConductores() {
  const token = document.getElementById("jwt-token").value.trim();
  if (!token) {
    setStatus("Primero pega o genera un token JWT", "err");
    return;
  }

  const h3Origin  = document.getElementById("h3-origin").value.trim();
  const h3Dest    = document.getElementById("h3-dest").value.trim();
  const myLat     = document.getElementById("my-lat").value;
  const myLng     = document.getElementById("my-lng").value;
  const departure = document.getElementById("departure").value;
  const tolerance = document.getElementById("tolerance").value;
  const k         = document.getElementById("k-radius").value;

  if (!h3Origin || !h3Dest || !myLat || !myLng || !departure) {
    setStatus("Completa todos los campos", "err");
    return;
  }

  setStatus("Buscando conductores...", "loading");
  document.getElementById("btn-buscar").disabled = true;

  const params = new URLSearchParams({
    my_h3_origin:           h3Origin,
    my_h3_destination:      h3Dest,
    my_lat:                 myLat,
    my_lng:                 myLng,
    departure_time:         departure + ":00",
    time_tolerance_minutes: tolerance,
    max_h3_distance:        k,
  });

  try {
    const res = await fetch(`${API_BASE}/match/nearby?${params}`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (!res.ok) {
      const err = await res.json();
      setStatus(`Error ${res.status}: ${err.detail || "Error del servidor"}`, "err");
      return;
    }

    const data = await res.json();
    renderResultados(data, parseFloat(myLat), parseFloat(myLng));

  } catch (e) {
    setStatus("No se pudo conectar al servidor FastAPI. ¿Está corriendo?", "err");
  } finally {
    document.getElementById("btn-buscar").disabled = false;
  }
}

// ══════════════════════════════════════════
// RENDERIZAR RESULTADOS
// ══════════════════════════════════════════
function renderResultados(data, myLat, myLng) {
  // Limpiar marcadores anteriores
  markers.forEach(m => m.setMap(null));
  markers = [];
  if (passengerMarker) passengerMarker.setMap(null);
  infoWindow.close();

  // Centrar mapa en el pasajero
  const center = { lat: data.center_lat, lng: data.center_lng };
  map.setCenter(center);
  map.setZoom(14);

  // Marcador del pasajero (azul)
  passengerMarker = new google.maps.Marker({
    position: center,
    map,
    title: "Tu ubicación",
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      fillColor: "#2563eb",
      fillOpacity: 1,
      strokeColor: "white",
      strokeWeight: 2,
      scale: 10,
    },
    zIndex: 999,
  });

  // Sin resultados
  if (data.total === 0) {
    setStatus(data.message || "Sin conductores disponibles", "err");
    document.getElementById("results").innerHTML =
      `<div class="empty">😕 ${data.message || "Sin resultados"}</div>`;
    return;
  }

  setStatus(`${data.total} conductor(es) encontrado(s)`, "ok");

  // Renderizar marcadores y cards
  let cardsHtml = "";

  data.markers.forEach((m, i) => {
    const hora = new Date(m.departure_datetime)
      .toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
    const costo = m.cost_per_passenger
      ? `$${m.cost_per_passenger.toLocaleString("es-CO")}`
      : "Sin costo";
    const score = Math.round(m.relevance_score * 100);

    // Marcador verde en el mapa
    const marker = new google.maps.Marker({
      position: { lat: m.origin_lat, lng: m.origin_lng },
      map,
      title: m.driver_name,
      label: {
        text: `${i + 1}`,
        color: "white",
        fontWeight: "bold",
        fontSize: "12px",
      },
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        fillColor: "#22c55e",
        fillOpacity: 1,
        strokeColor: "white",
        strokeWeight: 2,
        scale: 14,
      },
      zIndex: 100 - i,
    });

    // Popup del marcador
    const popupContent = `
      <div style="font-family: Segoe UI, sans-serif; min-width: 200px; padding: 4px">
        <div style="font-weight: 700; color: #003366; font-size: 15px; margin-bottom: 8px">
          🚗 ${m.driver_name}
        </div>
        <div style="font-size: 13px; color: #444; margin-bottom: 4px">
          📍 <b>Desde:</b> ${m.origin_address}
        </div>
        <div style="font-size: 13px; color: #444; margin-bottom: 4px">
          🏁 <b>Hasta:</b> ${m.destination_address}
        </div>
        <div style="font-size: 13px; color: #444; margin-bottom: 4px">
          🕐 <b>Sale a las:</b> ${hora}
        </div>
        <div style="font-size: 13px; color: #444; margin-bottom: 4px">
          💺 <b>Cupos:</b> ${m.available_seats}
        </div>
        <div style="font-size: 13px; color: #444; margin-bottom: 8px">
          💰 <b>Costo:</b> ${costo}
        </div>
        <div style="background: #003366; color: white; text-align: center;
          border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 700">
          Relevancia: ${score}%
        </div>
      </div>
    `;

    marker.addListener("click", () => {
      infoWindow.setContent(popupContent);
      infoWindow.open(map, marker);
      // Resaltar card correspondiente
      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      document.getElementById(`card-${i}`)?.classList.add("active");
    });

    markers.push(marker);

    // Card en el panel
    cardsHtml += `
      <div class="card" id="card-${i}" onclick="clickCard(${i})">
        <div class="card-header">
          <div class="card-name">🚗 ${m.driver_name}</div>
          <div class="score-badge">${score}%</div>
        </div>
        <div class="card-row">🕐 Sale a las <span>${hora}</span></div>
        <div class="card-row">💺 Cupos <span>${m.available_seats}</span></div>
        <div class="card-row">💰 Costo <span>${costo}</span></div>
        <div class="card-row">📏 Distancia H3 <span>${m.distance_h3_origin} paso(s)</span></div>
      </div>
    `;
  });

  document.getElementById("results").innerHTML = cardsHtml;
}

// ══════════════════════════════════════════
// CLICK EN CARD → abrir popup en mapa
// ══════════════════════════════════════════
function clickCard(i) {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
  document.getElementById(`card-${i}`)?.classList.add("active");

  if (markers[i]) {
    map.panTo(markers[i].getPosition());
    google.maps.event.trigger(markers[i], "click");
  }
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function setStatus(msg, type = "") {
  const el = document.getElementById("status");
  el.className = `status ${type}`;
  el.innerHTML = `<div class="dot"></div>${msg}`;
}

function generateTestToken() {
  setStatus("Para generar el token, corre en tu terminal:", "loading");
  const cmd = `python -c "
import jwt, datetime
token = jwt.encode(
  {'sub': 2, 'rol': 'Estudiante',
   'correo': 'ana@universidadean.edu.co',
   'exp': datetime.datetime.utcnow() + datetime.timedelta(hours=8)},
  'super_secreto_ean_2025_cambiame', algorithm='HS256')
print(token)"`;

  // Copiar comando al portapapeles
  navigator.clipboard.writeText(cmd).then(() => {
    setStatus("✓ Comando copiado al portapapeles — pégalo en la terminal", "ok");
  }).catch(() => {
    setStatus("Corre el comando de la terminal para generar el token", "loading");
  });
}
</script>

<!-- Carga Google Maps con tu frontend-key -->
<script
  src="https://maps.googleapis.com/maps/api/js?key=GOOGLE_MAPS_API_KEY_FRONTEND&callback=initMap"
  async defer>
</script>

</body>
</html>
